<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — Génération 1</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #f3f5f7;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .intro {
      text-align: center;
      color: #555;
      margin-top: 0;
      margin-bottom: 24px;
    }

    #status {
      text-align: center;
      margin: 16px 0;
      color: #555;
      min-height: 1.2em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
      min-width: 0;
    }

    .number {
      color: #777;
      font-size: 0.9rem;
    }

    .sprite {
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: block;
      margin: 8px auto;
    }

    .unknown {
      display: flex;
      width: 100px;
      height: 100px;
      margin: 8px auto;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #edf0f3;
      color: #8a929b;
      font-size: 3.4rem;
      font-weight: bold;
    }

    .name {
      margin: 8px 0 6px;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .types {
      min-height: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 10px;
    }

    .type-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 0.78rem;
      font-weight: bold;
      line-height: 1.2;
    }

    .type-electrik {
      background: #fef3c7;
      color: #92400e;
    }

    .type-insecte {
      background: #dcfce7;
      color: #166534;
    }

    .type-poison {
      background: #f3e8ff;
      color: #6b21a8;
    }

    .type-feu {
      background: #fee2e2;
      color: #991b1b;
    }

    .type-eau {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .type-plante {
      background: #d1fae5;
      color: #065f46;
    }

    .type-vol {
      background: #e0e7ff;
      color: #3730a3;
    }

    .type-normal {
      background: #f3f4f6;
      color: #374151;
    }

    .type-combat {
      background: #ffedd5;
      color: #9a3412;
    }

    .type-psy {
      background: #fce7f3;
      color: #9d174d;
    }

    .type-roche {
      background: #e7e5e4;
      color: #44403c;
    }

    .type-sol {
      background: #fef3c7;
      color: #78350f;
    }

    .type-spectre {
      background: #e9d5ff;
      color: #581c87;
    }

    .type-glace {
      background: #cffafe;
      color: #155e75;
    }

    .type-dragon {
      background: #ede9fe;
      color: #5b21b6;
    }

    .type-acier {
      background: #e2e8f0;
      color: #334155;
    }

    .type-fee {
      background: #fce7f3;
      color: #9d174d;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: wait;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Pokédex</h1>
    <p class="intro">Première génération</p>
    <p id="status" role="status">Chargement du Pokédex…</p>
    <section id="pokedex" class="grid" aria-label="Liste des Pokémon"></section>
  </main>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8000";
    const POKEMON_LIST_ENDPOINT = `${API_BASE_URL}/pokemons`;
    const SCAN_ENDPOINT = (number) => `${API_BASE_URL}/pokemons/${number}/scan`;

    const AUTH_TOKEN = "ENSEA2026";

    const pokedex = document.getElementById("pokedex");
    const status = document.getElementById("status");

    function getPokemonNumber(pokemon) {
      return Number(pokemon.number ?? pokemon.id);
    }

    function getTypes(value) {
      // Accepte un tableau JSON, ou une chaîne contenant par exemple
      // ["Électrik"] ou ["Insecte", "Poison"].
      if (Array.isArray(value)) return value;
      if (typeof value === "string") {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return value.trim() ? [value.trim()] : [];
        }
      }
      return [];
    }

    function normalizeType(type) {
      return String(type)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function createCard(number, pokemon) {
      const card = document.createElement("article");
      card.className = "card";

      const numberLabel = document.createElement("div");
      numberLabel.className = "number";
      numberLabel.textContent = `N° ${String(number).padStart(3, "0")}`;
      card.appendChild(numberLabel);

      if (pokemon) {
        card.style.cursor = "pointer";
        card.addEventListener("click", () => {
          window.location.href = `pokemon_detail.html?number=${number}`;
        });
        const image = document.createElement("img");
        image.className = "sprite";
        image.alt = pokemon.name_fr || pokemon.name || `Pokémon ${number}`;
        image.src = pokemon.image_url || "";
        image.onerror = () => {
          image.replaceWith(makeUnknown());
        };
        card.appendChild(image);

        const name = document.createElement("h2");
        name.className = "name";
        name.textContent = pokemon.name_fr || pokemon.name || `Pokémon ${number}`;
        card.appendChild(name);

        const types = document.createElement("div");
        types.className = "types";
        getTypes(pokemon.types).forEach((type) => {
          const badge = document.createElement("span");
          badge.className = `type-badge type-${normalizeType(type)}`;
          badge.textContent = type;
          types.appendChild(badge);
        });
        card.appendChild(types);
      } else {
        const unknown = document.createElement("div");
        unknown.className = "unknown";
        unknown.setAttribute("aria-label", "Pokémon non scanné");
        unknown.textContent = "?";
        card.appendChild(unknown);

        const button = document.createElement("button");
        button.textContent = "Scanner";
        button.type = "button";
        button.addEventListener("click", () => scanPokemon(number, button));
        card.appendChild(button);
      }

      return card;
    }

    async function loadPokemon() {
      status.textContent = "Chargement des données depuis l’API…";
      try {
        const response = await fetch(POKEMON_LIST_ENDPOINT);
        if (!response.ok) {
          throw new Error(`Erreur HTTP ${response.status}`);
        }
        const data = await response.json();
        if (!Array.isArray(data)) {
          throw new Error("L’API doit renvoyer une liste de Pokémon.");
        }

        const byNumber = new Map();
        for (const pokemon of data) {
          const number = getPokemonNumber(pokemon);
          if (Number.isInteger(number) && number >= 1 && number <= 151) {
            byNumber.set(number, pokemon);
          }
        }

        renderPokedex(byNumber);
        const knownCount = byNumber.size;
        status.textContent = `${knownCount} Pokémon enregistré(s) sur 151`;
      } catch (error) {
        // On affiche quand même les 151 entrées, avec les données inconnues.
        renderPokedex(new Map());
        status.textContent = `Impossible de charger la liste depuis l’API (${error.message}). Vérifiez que FastAPI est lancé et que le CORS est configuré.`;
      }
    }

    function renderPokedex(byNumber) {
      pokedex.replaceChildren();
      for (let number = 1; number <= 151; number++) {
        pokedex.appendChild(createCard(number, byNumber.get(number) || null));
      }
    }

    async function scanPokemon(number, button) {
      button.disabled = true;
      button.textContent = "Scan en cours…";
      status.textContent = `Scan du Pokémon n° ${number}…`;

      try {
        const headers = {};
        if (AUTH_TOKEN) {
          headers.Authorization = `Bearer ${AUTH_TOKEN}`;
        }

        const response = await fetch(SCAN_ENDPOINT(number), {
          method: "GET",
          headers
        });

        if (!response.ok) {
          const details = await response.text();
          throw new Error(`Erreur HTTP ${response.status}${details ? ` — ${details}` : ""}`);
        }

        // L’API peut renvoyer le Pokémon scanné ; sinon on recharge la liste.
        const scannedPokemon = await response.json().catch(() => null);
        if (scannedPokemon && (scannedPokemon.number || scannedPokemon.id)) {
          const current = new Map();
          document.querySelectorAll(".card").forEach((card) => {
            const label = card.querySelector(".number")?.textContent || "";
            const match = label.match(/(\d+)/);
            if (!match) return;
            const n = Number(match[1]);
            const title = card.querySelector(".name")?.textContent || "?";
            if (title !== "?") {
              current.set(n, {
                number: n,
                name_fr: title,
                types: Array.from(card.querySelectorAll(".type-badge"), (badge) => badge.textContent),
                image_url: card.querySelector("img")?.src || ""
              });
            }
          });
          current.set(number, scannedPokemon);
          renderPokedex(current);
          status.textContent = `Pokémon n° ${number} scanné avec succès.`;
        } else {
          await loadPokemon();
          status.textContent = `Scan du Pokémon n° ${number} terminé.`;
        }
      } catch (error) {
        status.textContent = `Échec du scan du Pokémon n° ${number} : ${error.message}`;
        button.disabled = false;
        button.textContent = "Réessayer";
      }
    }

    loadPokemon();
  </script>
</body>

</html>
